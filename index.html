<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lapak 1455 - Kasir</title>
  <!-- Library React, Babel, Tailwind & HTML2Canvas -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            white: '#f8fafc', 
            gray: {
              50: '#f1f5f9', 100: '#e2e8f0', 200: '#cbd5e1', 300: '#94a3b8', 400: '#64748b',
              500: '#475569', 600: '#334155', 700: '#1e293b', 800: '#0f172a', 900: '#020617', 950: '#000000',
            }
          }
        }
      }
    }
  </script>
  <!-- Ikon Web -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes zoom-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-zoom-in { animation: zoom-in 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    @keyframes slide-down { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-slide-down { animation: slide-down 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    input[type="checkbox"] {
      appearance: none; background-color: #f1f5f9; margin: 0; font: inherit; color: currentColor;
      width: 1.25em; height: 1.25em; border: 1px solid #cbd5e1; border-radius: 0.25em;
      display: grid; place-content: center; cursor: pointer; transition: all 0.2s;
    }
    .dark input[type="checkbox"] { background-color: #020617; border-color: #1e293b; }
    input[type="checkbox"]::before {
      content: ""; width: 0.65em; height: 0.65em; transform: scale(0); transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em white; transform-origin: center;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }
    input[type="checkbox"]:checked { background-color: #2563eb; border-color: #2563eb; }
    .dark input[type="checkbox"]:checked { background-color: #2563eb; border-color: #2563eb; }
    input[type="checkbox"]:checked::before { transform: scale(1); }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased font-sans transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) { return initialValue; }
      });
      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(storedValue));
        } catch (error) {}
      }, [key, storedValue]);
      return [storedValue, setStoredValue];
    }

    const Icon = ({ name, size = 16, className = "", onClick }) => (
      <i className={`fa-solid fa-${name} ${className}`} style={{ fontSize: size }} onClick={onClick}></i>
    );

    function App() {
      const [theme, setTheme] = useLocalStorage('lapak_theme', 'dark');
      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [theme]);

      const [syncStatus, setSyncStatus] = useState('Mode Lokal');
      const [currentUser, setCurrentUser] = useState(null); 
      const [usernameInput, setUsernameInput] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const adminAccount = {
        username: 'admin', pin: '1234', name: 'Administrator Utama', role: 'admin',
        permissions: { trx: true, gudang: true, addBrg: true, editBrg: true, restok: true, kas: true, addKas: true, subKas: true, hutang: true }
      };

      const hasPerm = (perm) => {
        if (currentUser?.role === 'admin') return true;
        return currentUser?.permissions?.[perm] === true;
      };

      const [operators, setOperators] = useLocalStorage('lapak_operators', []);
      const [products, setProducts] = useLocalStorage('lapak_products', []);
      const [transactions, setTransactions] = useLocalStorage('lapak_transactions', []);
      const [purchases, setPurchases] = useLocalStorage('lapak_purchases', []);
      const [cashFlows, setCashFlows] = useLocalStorage('lapak_cashflows', []); 
      
      const isInitialMount = useRef(true);

      // URL Web App GAS (GANTI DENGAN URL WEB APP MILIK ANDA)
      const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyL7GEYbTjhqDh-4zRSb4JphL3R3C2aT_6gPbYBC5wp6iab3tnDM6Vt5A2wl6tZS9ox/exec';

      // Sinkronisasi Data dari Server GAS (Google Drive)
      useEffect(() => {
        if (GAS_API_URL && GAS_API_URL !== 'MASUKKAN_URL_WEB_APP_GAS_DISINI') {
          setSyncStatus('Memuat Cloud...');
          fetch(GAS_API_URL + '?t=' + Date.now(), { cache: 'no-store' })
            .then(res => res.json())
            .then(resData => {
              if (resData.status === 'success' && resData.data) {
                try {
                  const cloudData = JSON.parse(resData.data);
                  if(cloudData.products) setProducts(cloudData.products);
                  if(cloudData.transactions) setTransactions(cloudData.transactions);
                  if(cloudData.purchases) setPurchases(cloudData.purchases);
                  if(cloudData.cashFlows) setCashFlows(cloudData.cashFlows);
                  if(cloudData.operators) setOperators(cloudData.operators);
                } catch(e) {}
              }
              setSyncStatus('Tersinkronisasi ☁️');
            })
            .catch(() => setSyncStatus('Gagal Muat ❌'));
        }
      }, []);

      // Simpan Data Otomatis ke Google Drive
      useEffect(() => {
        if (isInitialMount.current) {
          isInitialMount.current = false;
          return;
        }

        if (GAS_API_URL && GAS_API_URL !== 'MASUKKAN_URL_WEB_APP_GAS_DISINI') {
          setSyncStatus('Menyimpan...');
          const timer = setTimeout(() => {
            const allData = { products, transactions, purchases, cashFlows, operators };
            fetch(GAS_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(allData)
            })
            .then(res => res.json())
            .then((resData) => {
              if(resData.status === 'success') setSyncStatus('Tersinkronisasi ☁️');
              else setSyncStatus('Gagal Simpan ❌');
            })
            .catch(() => setSyncStatus('Gagal Simpan ❌'));
          }, 1500); 
          return () => clearTimeout(timer);
        }
      }, [products, transactions, purchases, cashFlows, operators]);

      // --- STATE APLIKASI ---
      const [activeTab, setActiveTab] = useState('transaksi');
      const [kasPeriod, setKasPeriod] = useState('harian'); 
      const [searchQuery, setSearchQuery] = useState('');
      const [viewMode, setViewMode] = useState('list'); 
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDate, setSelectedDate] = useState(new Date());
      
      const [cart, setCart] = useState([]);
      const [cartDiscount, setCartDiscount] = useState(0);
      const [checkoutSuccess, setCheckoutSuccess] = useState(false);
      const [showMobileCart, setShowMobileCart] = useState(false);

      const [showAddOperator, setShowAddOperator] = useState(false);
      const [newOpData, setNewOpData] = useState({ 
        name: '', username: '', pin: '', 
        permissions: { trx: true, gudang: false, addBrg: false, editBrg: false, restok: false, kas: false, addKas: false, subKas: false, hutang: false } 
      });
      const [showAddProduct, setShowAddProduct] = useState(false);
      const [newProduct, setNewProduct] = useState({ name: '', purchasePrice: '', price: '', stock: '' });
      const [showRestockModal, setShowRestockModal] = useState(false);
      const [restockData, setRestockData] = useState({ product: null, qty: 1, paymentMethod: 'Tunai', supplierName: '' });
      const [showResetModal, setShowResetModal] = useState(false);
      const [showLogoutModal, setShowLogoutModal] = useState(false);
      const [editingProductId, setEditingProductId] = useState(null);
      const [editProductData, setEditProductData] = useState({ name: '', purchasePrice: '', price: '' });
      
      const [cashModal, setCashModal] = useState({ isOpen: false, type: 'ADD' });
      const [cashInput, setCashInput] = useState({ amount: '', desc: '', supplierName: '' });
      const [showHistoryModal, setShowHistoryModal] = useState({ isOpen: false, type: null }); 
      const [deleteConfirm, setDeleteConfirm] = useState({ isOpen: false, type: null, id: null });
      const [showAssetModal, setShowAssetModal] = useState({ isOpen: false, product: null });
      
      // State Khusus Struk Digital & Sharing
      const [digitalReceipt, setDigitalReceipt] = useState(null);
      const [isSharing, setIsSharing] = useState(false);

      // --- PERHITUNGAN ---
      const cartSubtotal = cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);
      const cartTotal = Math.max(0, cartSubtotal - cartDiscount);
      const cartItemCount = cart.reduce((sum, item) => sum + item.qty, 0);

      const globalDebtPay = cashFlows.filter(c => c.type === 'PAY_DEBT').reduce((s, c) => s + c.total, 0);
      const globalHutang = purchases.filter(p => p.paymentMethod === 'Kredit').reduce((s, p) => s + p.total, 0) - globalDebtPay;

      const getSupplierDebtsList = () => {
        const debts = {};
        purchases.forEach(p => {
          if (p.paymentMethod === 'Kredit' && p.supplierName) {
            debts[p.supplierName] = (debts[p.supplierName] || 0) + p.total;
          }
        });
        cashFlows.forEach(c => {
          if (c.type === 'PAY_DEBT' && c.supplierName) {
            debts[c.supplierName] = (debts[c.supplierName] || 0) - c.total;
          }
        });
        return Object.entries(debts).filter(([k,v]) => v > 0).map(([k,v]) => ({name: k, amount: v}));
      };
      const supplierDebtsList = getSupplierDebtsList();

      const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number || 0);
      const getTimestampFromId = (id) => id ? parseInt(id.split('-')[1] || 0) : 0;
      const isSameDay = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
      
      const isSamePeriod = (timestamp, period, targetDate = new Date()) => {
        if (!timestamp) return false;
        const date = new Date(timestamp);
        if (period === 'harian') return isSameDay(date, targetDate);
        if (period === 'bulanan') return date.getMonth() === targetDate.getMonth() && date.getFullYear() === targetDate.getFullYear();
        if (period === 'tahunan') return date.getFullYear() === targetDate.getFullYear();
        return true;
      };

      const calculateTrxLaba = (trx) => {
        if (!trx || trx.type === 'OUT' || !trx.items) return 0;
        const baseLaba = trx.items.reduce((sum, item) => sum + (((item.product.price || 0) - (item.product.purchasePrice || 0)) * item.qty), 0);
        return baseLaba - (trx.discount || 0);
      };

      useEffect(() => {
        if (cart.length === 0 && showMobileCart) {
          setShowMobileCart(false);
        }
      }, [cart, showMobileCart]);

      // --- HANDLERS ---
      const handleLogin = (e) => {
        e.preventDefault();
        const user = usernameInput.toLowerCase().trim();
        if (user === adminAccount.username && pinInput === adminAccount.pin) {
          setCurrentUser(adminAccount); setActiveTab('transaksi'); resetLoginFields();
        } else {
          const foundOp = operators.find(op => op.username === user && op.pin === pinInput);
          if (foundOp) { 
            setCurrentUser(foundOp); 
            if (foundOp.permissions?.trx) setActiveTab('transaksi');
            else if (foundOp.permissions?.gudang) setActiveTab('gudang');
            else if (foundOp.permissions?.kas) setActiveTab('kas');
            else setActiveTab('pengaturan');
            resetLoginFields(); 
          } 
          else { setLoginError('Username atau PIN salah!'); }
        }
      };

      const resetLoginFields = () => { setUsernameInput(''); setPinInput(''); setLoginError(''); };
      const handleLogoutAction = () => { setCurrentUser(null); setShowLogoutModal(false); setActiveTab('transaksi'); setCart([]); setCartDiscount(0); };

      const addToCart = (product) => {
        if (!product || product.stock <= 0) return;
        setCart(prev => {
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) {
            if (existing.qty >= product.stock) return prev; 
            return prev.map(item => item.product.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { product, qty: 1 }];
        });
      };

      const updateCartQty = (productId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.product.id === productId) {
            const newQty = item.qty + delta;
            if (newQty > 0 && newQty <= (item.product.stock || 0)) return { ...item, qty: newQty };
          }
          return item;
        }).filter(item => item.qty > 0));
      };

      const handleClearCart = () => { setCart([]); setCartDiscount(0); setShowMobileCart(false); };

      const handleCheckout = () => {
        if (!currentUser || cart.length === 0) return;
        const newTransaction = {
          id: `TRX-${Date.now()}`,
          date: new Date().toLocaleString('id-ID'),
          items: [...cart],
          subtotal: cartSubtotal,
          discount: cartDiscount,
          total: cartTotal,
          paymentMethod: 'Tunai', 
          type: 'IN',
          operator: currentUser.name
        };
        setProducts(prev => prev.map(p => {
          const item = cart.find(c => c.product.id === p.id);
          return item ? { ...p, stock: p.stock - item.qty } : p;
        }));
        setTransactions(prev => [newTransaction, ...prev]);
        
        // Menampilkan Struk Otomatis Setelah Bayar
        setDigitalReceipt(newTransaction);
        setIsSharing(false);
        
        setCart([]); setCartDiscount(0); setCheckoutSuccess(true);
        setShowMobileCart(false);
        setTimeout(() => setCheckoutSuccess(false), 2500);
      };

      const handleRestock = (e) => {
        e.preventDefault();
        if (!currentUser || !restockData.product || restockData.qty <= 0) return;
        const qty = parseInt(restockData.qty);
        const newPurchase = {
          id: `SUP-${Date.now()}`,
          date: new Date().toLocaleString('id-ID'),
          items: [{ product: restockData.product, qty }],
          total: qty * restockData.product.purchasePrice,
          paymentMethod: restockData.paymentMethod,
          supplierName: restockData.paymentMethod === 'Kredit' ? restockData.supplierName : '',
          type: 'OUT',
          operator: currentUser.name
        };
        setPurchases(prev => [newPurchase, ...prev]);
        setProducts(prev => prev.map(p => p.id === restockData.product.id ? { ...p, stock: p.stock + qty } : p));
        setShowRestockModal(false);
        
        // Menampilkan Struk Stok Otomatis
        setDigitalReceipt(newPurchase);
        setIsSharing(false);
      };

      const handleCashSubmit = (e) => {
        e.preventDefault();
        if (!currentUser || !cashInput.amount) return;
        const amt = parseInt(cashInput.amount);
        if (amt <= 0) return;
        
        let finalAmt = amt;
        let selectedSupName = cashInput.supplierName;
        let sisaHutang = 0;
        let hutangAwal = 0;

        if (cashModal.type === 'PAY_DEBT') {
           if (!selectedSupName) return; // Wajib pilih supplier
           const maxDebt = supplierDebtsList.find(s => s.name === selectedSupName)?.amount || 0;
           hutangAwal = maxDebt;
           if (amt > maxDebt) finalAmt = maxDebt;
           sisaHutang = maxDebt - finalAmt; // Hitung sisa hutang setelah bayar
        }

        const newFlow = {
          id: `CASH-${Date.now()}`,
          date: new Date().toLocaleString('id-ID'),
          type: cashModal.type,
          total: finalAmt,
          description: cashInput.desc || (cashModal.type === 'ADD' ? 'Tambah Kas' : cashModal.type === 'SUBTRACT' ? 'Tarik Kas' : `Bayar Hutang - ${selectedSupName}`),
          operator: currentUser.name,
          supplierName: cashModal.type === 'PAY_DEBT' ? selectedSupName : '',
          hutangSebelumnya: cashModal.type === 'PAY_DEBT' ? hutangAwal : 0,
          sisaHutang: cashModal.type === 'PAY_DEBT' ? sisaHutang : 0
        };
        setCashFlows(prev => [newFlow, ...prev]);
        setCashModal({ isOpen: false, type: 'ADD' });
        setCashInput({ amount: '', desc: '', supplierName: '' });

        // Tampilkan Bukti Setelah Input Kas
        setDigitalReceipt(newFlow);
        setIsSharing(false);
      };

      const saveProductDetails = (productId) => {
        setProducts(prev => prev.map(p => p.id === productId ? { ...p, name: editProductData.name, purchasePrice: parseInt(editProductData.purchasePrice), price: parseInt(editProductData.price) } : p));
        setEditingProductId(null);
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        const added = { 
          id: Date.now(), name: newProduct.name, purchasePrice: parseInt(newProduct.purchasePrice) || 0, price: parseInt(newProduct.price) || 0, stock: parseInt(newProduct.stock) || 0, category: 'Barang' 
        };
        setProducts([...products, added]); 
        setShowAddProduct(false);
        setNewProduct({ name: '', purchasePrice: '', price: '', stock: '' });
      };

      const handleResetData = () => {
        setProducts([]); setTransactions([]); setPurchases([]); setCart([]); setCartDiscount(0); setCashFlows([]); setShowResetModal(false);
      };

      const handleAddOperator = (e) => {
        e.preventDefault();
        const op = { 
          id: `op-${Date.now()}`, name: newOpData.name, username: newOpData.username.toLowerCase(), pin: newOpData.pin, role: 'operator', permissions: newOpData.permissions 
        };
        setOperators([...operators, op]); 
        setShowAddOperator(false);
        setNewOpData({ name: '', username: '', pin: '', permissions: { trx: true, gudang: false, addBrg: false, editBrg: false, restok: false, kas: false, addKas: false, subKas: false, hutang: false } });
      };

      const deleteOperator = (id) => { setOperators(operators.filter(op => op.id !== id)); };

      const executeDelete = () => {
        if (deleteConfirm.type === 'trx') {
          const trxToDelete = transactions.find(t => t.id === deleteConfirm.id);
          if (trxToDelete && trxToDelete.items) {
            setProducts(prev => prev.map(p => {
              const foundItem = trxToDelete.items.find(i => i.product.id === p.id);
              if (foundItem) return { ...p, stock: p.stock + foundItem.qty };
              return p;
            }));
            setTransactions(prev => prev.filter(t => t.id !== deleteConfirm.id));
          }
        } else if (deleteConfirm.type === 'gudang') {
          const purToDelete = purchases.find(p => p.id === deleteConfirm.id);
          if (purToDelete && purToDelete.items) {
            setProducts(prev => prev.map(p => {
              const foundItem = purToDelete.items.find(i => i.product.id === p.id);
              if (foundItem) return { ...p, stock: p.stock - foundItem.qty };
              return p;
            }));
            setPurchases(prev => prev.filter(p => p.id !== deleteConfirm.id));
          }
        } else if (deleteConfirm.type === 'kas') {
          setCashFlows(prev => prev.filter(c => c.id !== deleteConfirm.id));
        }
        setDeleteConfirm({ isOpen: false, type: null, id: null });
      };
      
      // --- FUNGSI DOWNLOAD/SHARE GAMBAR STRUK ---
      const downloadFallback = (blob, fileName) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleShareReceiptImage = async () => {
        const receiptElement = document.getElementById('receipt-capture-area');
        if (!receiptElement || !digitalReceipt) return;
        
        setIsSharing(true);
        
        try {
          // Buat Canvas dari Elemen HTML Struk (Scale ditingkatkan agar tidak blur)
          const canvas = await html2canvas(receiptElement, {
            scale: 2, 
            backgroundColor: '#ffffff',
            useCORS: true
          });
          
          canvas.toBlob(async (blob) => {
            if (!blob) {
               setIsSharing(false);
               return;
            }
            
            const fileName = `Struk_${digitalReceipt.id}.png`;
            const file = new File([blob], fileName, { type: 'image/png' });
            
            // Coba gunakan Web Share API (Biasanya berfungsi baik di Chrome Android / Safari iOS)
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({
                  title: 'Struk Transaksi Lapak 1455',
                  files: [file]
                });
              } catch (error) {
                console.log('Share dibatalkan atau gagal, fallback ke download', error);
                downloadFallback(blob, fileName);
              }
            } else {
              // Jika Web Share tidak didukung, langsung download gambarnya ke HP/PC
              downloadFallback(blob, fileName);
            }
            
            setIsSharing(false);
          }, 'image/png');
          
        } catch (err) {
          console.error("Gagal membuat gambar struk:", err);
          alert("Gagal memproses gambar struk.");
          setIsSharing(false);
        }
      };

      const renderCalendarGrid = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const daysArr = [];

        for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) {
          daysArr.push(<div key={`empty-${i}`} className="h-16 md:h-24 border border-gray-100 dark:border-gray-800/30 bg-gray-50/50 dark:bg-gray-900/20"></div>);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month, d);
          const isToday = isSameDay(dateObj, new Date());
          const isSelected = isSameDay(dateObj, selectedDate);
          
          const dayTrx = transactions.filter(t => isSameDay(new Date(getTimestampFromId(t.id)), dateObj));
          const dayPurchases = purchases.filter(p => isSameDay(new Date(getTimestampFromId(p.id)), dateObj));
          const dayCash = cashFlows.filter(c => isSameDay(new Date(getTimestampFromId(c.id)), dateObj));
          
          const hasTrx = dayTrx.length > 0 || dayCash.some(c => c.type === 'ADD');
          const hasPurchases = dayPurchases.length > 0 || dayCash.some(c => ['SUBTRACT', 'PAY_DEBT'].includes(c.type));
          const dayIncome = dayTrx.reduce((s, t) => s + t.total, 0) + dayCash.filter(c => c.type === 'ADD').reduce((s, c) => s + c.total, 0);

          daysArr.push(
            <div 
              key={d}

                     <button onClick={() => setShowHistoryModal({isOpen: false, type: null})} className="p-1.5 md:p-2 text-gray-500 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-white dark:bg-gray-800 dark:hover:bg-gray-700 rounded-lg transition-colors"><Icon name="xmark"/></button>

                      {/* RIWAYAT TRANSAKSI PENJUALAN */}

                               <div className="flex justify-between items-start mb-2">
                                  <div><p className="text-xs font-bold text-gray-900 dark:text-gray-300">{t.id}</p><p className="text-[10px] text-gray-500">{t.date} • {t.operator}</p></div>

                                     <div className="text-right mr-2">
                                        <p className="text-sm font-bold text-green-600 dark:text-green-400">+{formatRupiah(t.total)}</p>

                                       <Icon name="file-invoice"/>
                                     </button>

                                       </button>

                                  <span>{formatRupiah(p.items[0].product.purchasePrice * p.items[0].qty)}</span>
                               </div>
                            </div>
                         )) : <div className="p-10 text-center text-gray-500 text-sm">Belum ada riwayat belanja stok.</div>
                      )}

                      {/* RIWAYAT KAS (CAMPURAN) */}
                      {showHistoryModal.type === 'kas' && (() => {
                          const allHistory = [...transactions.map(t=>({...t, recordType:'TRX'})), ...purchases.map(p=>({...p, recordType:'SUP'})), ...cashFlows.map(c=>({...c, recordType:'CASH'}))].sort((a, b) => getTimestampFromId(b.id) - getTimestampFromId(a.id));
                          return allHistory.length > 0 ? allHistory.map(trx => {
                            const isIncome = trx.recordType === 'TRX' || (trx.recordType === 'CASH' && trx.type === 'ADD');

                            return (
                              <div key={trx.id} className="p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 hover:bg-gray-50 dark:hover:bg-gray-800/30 rounded-xl transition-colors">
                                <div className="flex items-center gap-3">
                                  <div className={`p-2 rounded-lg ${isIncome ? 'bg-green-100 text-green-600 dark:bg-green-500/10 dark:text-green-400' : 'bg-red-100 text-red-600 dark:bg-red-500/10 dark:text-red-400'}`}>
                                    <Icon name={isIncome ? 'arrow-trend-down' : 'arrow-trend-up'} size={14}/>
                                  </div>
                                  <div>
                                    <p className="text-[11px] md:text-xs font-bold text-gray-900 dark:text-white">{title}</p>
                                    <p className="text-[9px] md:text-[10px] text-gray-500">{trx.recordType === 'CASH' && trx.description ? `${trx.description} • ` : ''}{trx.date} • {trx.operator}</p>

                                      <p className="text-[10px] text-orange-600 dark:text-orange-400 font-bold mt-0.5">Sisa Hutang: {formatRupiah(trx.sisaHutang)}</p>

                                  </div>
                                </div>
                                <div className="flex items-center justify-between md:justify-end border-t md:border-none border-gray-100 dark:border-gray-800 pt-2 md:pt-0 w-full md:w-auto">
                                  <div className="text-right ml-auto">
                                    <p className={`text-[11px] md:text-sm font-bold ${isIncome ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`}>{isIncome ? '+' : '-'}{formatRupiah(trx.total)}</p>
                                  </div>
                                  {/* TOMBOL LIHAT BUKTI/STRUK KAS BARU DITAMBAHKAN */}
                                  <button onClick={() => {setDigitalReceipt(trx); setIsSharing(false);}} className="ml-4 text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 p-2 bg-blue-50 hover:bg-blue-100 dark:bg-blue-500/10 dark:hover:bg-blue-500/20 rounded-lg transition-colors" title="Lihat Bukti Digital">
                                    <Icon name="file-invoice" size={14}/>
                                  </button>
                                  {currentUser?.role === 'admin' && (
                                     <button onClick={() => setDeleteConfirm({isOpen: true, type: trx.recordType === 'TRX' ? 'trx' : trx.recordType === 'SUP' ? 'gudang' : 'kas', id: trx.id})} className="ml-2 text-red-500 hover:text-red-600 dark:hover:text-red-400 p-2 bg-red-50 hover:bg-red-100 dark:bg-red-500/10 dark:hover:bg-red-500/20 rounded-lg transition-colors">
                                       <Icon name="trash" size={14}/>
                                     </button>
                                  )}
                                </div>
                              </div>
                            )
                          }) : <div className="p-10 text-center text-gray-500 text-sm">Tidak ada pergerakan kas.</div>
                      })()}
                   </div>
                </div>
              </div>

                               value={cashInput.supplierName}
                               onChange={e => setCashInput({...cashInput, supplierName: e.target.value, amount: ''})}
                             >
                               <option value="">-- Pilih Supplier --</option>
                               {supplierDebtsList.map(sup => (
                                 <option key={sup.name} value={sup.name}>{sup.name}</option>
                               ))}
                             </select>
                           </div>
                           {cashInput.supplierName ? (
                             <div className="bg-orange-50 dark:bg-orange-500/10 border border-orange-200 dark:border-orange-500/20 p-3 rounded-xl mb-4 text-center">
                                <p className="text-[10px] text-orange-600 dark:text-orange-400 font-bold uppercase">Sisa Hutang {cashInput.supplierName}</p>
                                <p className="text-lg font-black text-orange-700 dark:text-orange-400">
                                   {formatRupiah(supplierDebtsList.find(s => s.name === cashInput.supplierName)?.amount || 0)}

                             </div>

                             <div className="bg-orange-50 dark:bg-orange-500/10 border border-orange-200 dark:border-orange-500/20 p-3 rounded-xl mb-4 text-center opacity-50">
                                <p className="text-[10px] text-orange-600 dark:text-orange-400 font-bold uppercase">Total Hutang Global</p>
                                <p className="text-lg font-black text-orange-700 dark:text-orange-400">{formatRupiah(globalHutang)}</p>
                             </div>
                           )}
                         </>

                      <div className="space-y-1"><label className="text-[10px] font-bold text-gray-500 uppercase">Keterangan Opsional</label><input type="text" className="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-800 rounded-xl py-3 px-4 text-sm text-gray-900 dark:text-white focus:border-blue-500 outline-none transition-colors" value={cashInput.desc} onChange={e=>setCashInput({...cashInput, desc: e.target.value})} placeholder={cashModal.type === 'ADD' ? 'Modal tambahan...' : cashModal.type === 'SUBTRACT' ? 'Keperluan toko...' : 'Cicilan hutang...'} /></div>
                      <button type="submit" disabled={cashModal.type === 'PAY_DEBT' && (!cashInput.supplierName || (supplierDebtsList.find(s => s.name === cashInput.supplierName)?.amount || 0) <= 0)} className="w-full bg-blue-600 hover:bg-blue-700 text-white disabled:bg-gray-200 dark:disabled:bg-gray-800 disabled:text-gray-400 dark:disabled:text-gray-500 py-3.5 rounded-2xl font-bold shadow-lg mt-2 transition-colors">{cashModal.type === 'PAY_DEBT' && supplierDebtsList.length === 0 ? 'Tidak Ada Hutang' : 'Simpan Transaksi'}</button>
                   </form>
                </div>
              </div>
            )}

            {/* Modal Batal/Hapus & Logout/Reset dsb.. */}
            {deleteConfirm.isOpen && (
               <div className="fixed inset-0 z-[300] flex items-center justify-center p-4">
                 <div className="absolute inset-0 bg-black/50 dark:bg-black/80 backdrop-blur-sm transition-opacity" onClick={() => setDeleteConfirm({isOpen: false, type: null, id: null})}></div>
                 <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 w-full max-w-sm rounded-3xl shadow-2xl z-[310] p-6 text-center animate-zoom-in text-gray-900 dark:text-white">
                    <div className="w-16 h-16 bg-red-100 dark:bg-red-500/10 text-red-600 dark:text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="trash" size={28}/></div>

                    <div className="grid grid-cols-2 gap-3 mt-4">
                       <button onClick={() => setDeleteConfirm({isOpen: false, type: null, id: null})} className="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 py-3 rounded-xl font-bold transition-colors">Batal</button>
                       <button onClick={executeDelete} className="bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold transition-colors shadow">Ya, Hapus</button>

               </div>

            {showLogoutModal && (
              <div className="fixed inset-0 z-[200] flex items-center justify-center p-4">
                <div className="absolute inset-0 bg-black/50 dark:bg-black/80 backdrop-blur-sm transition-opacity" onClick={() => setShowLogoutModal(false)}></div>
                <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 w-full max-w-sm rounded-3xl shadow-2xl z-[210] p-6 text-center animate-zoom-in text-gray-900 dark:text-white">
                   <div className="w-16 h-16 bg-blue-100 dark:bg-blue-500/10 text-blue-600 dark:text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="right-from-bracket" size={28}/></div>
                   <h3 className="font-bold text-lg mb-2">Keluar Aplikasi?</h3>
                   <div className="grid grid-cols-2 gap-3 mt-4"><button onClick={() => setShowLogoutModal(false)} className="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 py-3 rounded-xl font-bold transition-colors">Batal</button><button onClick={handleLogoutAction} className="bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition-colors shadow">Keluar</button></div>
                </div>
              </div>

            {showResetModal && (
              <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 text-gray-900 dark:text-white">
                <div className="absolute inset-0 bg-black/50 dark:bg-black/80 backdrop-blur-sm transition-opacity" onClick={() => setShowResetModal(false)}></div>
                <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 w-full max-w-sm rounded-3xl shadow-2xl z-[210] p-6 text-center animate-zoom-in">

                   <h3 className="font-bold text-lg mb-2">Reset Data?</h3>
                   <p className="text-xs text-gray-500 dark:text-gray-400 mb-4">Semua data transaksi, laporan kas, dan daftar gudang akan dikosongkan. Ini tidak bisa dibatalkan.</p>
                   <div className="grid grid-cols-2 gap-3 mt-4"><button onClick={() => setShowResetModal(false)} className="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 py-3 rounded-xl font-bold transition-colors">Batal</button><button onClick={handleResetData} className="bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold transition-colors shadow">Reset</button></div>
                </div>
              </div>
            )}

            {/* Modal Restok / Tambah Produk / Edit dll (seperti biasa) */}
            {showRestockModal && (
              <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 text-gray-900 dark:text-white">

                <div className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 w-full max-w-sm rounded-3xl shadow-2xl z-[160] overflow-hidden animate-zoom-in">

                    {/* AREA TOMBOL (TIDAK MASUK KE GAMBAR) */}
                    <div className="px-6 pb-6 pt-2 flex flex-col gap-2 bg-white relative z-20">
                        <button disabled={isSharing} onClick={handleShareReceiptImage} className="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                          {isSharing ? (
                            <><Icon name="spinner" className="fa-spin"/> Memproses...</>
                          ) : (
                            <><Icon name="share-nodes"/> Bagikan Gambar Bukti</>
                          )}
                        </button>
                        <button disabled={isSharing} onClick={() => setDigitalReceipt(null)} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 py-3 rounded-lg font-bold transition-colors disabled:opacity-50">
                          Tutup
                        </button>
                    </div>
                  </div>
                </div>
              )}
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
